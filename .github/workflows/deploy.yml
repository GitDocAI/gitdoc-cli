name: Release DockitAI CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and package
        env:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          sed -i 's/const VERSION = ""/const VERSION = "'$VERSION'"/' config/const.go
          
          mkdir -p npm-publish/dist

          echo "Building dockitai-cli for multiple platforms..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "npm-publish/dist/dockitai-cli-darwin-x64" .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "npm-publish/dist/dockitai-cli-darwin-arm64" .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "npm-publish/dist/dockitai-cli-linux-arm64" .
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "npm-publish/dist/dockitai-cli-linux-x64" .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o "npm-publish/dist/dockitai-cli-win32-x64.exe" .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o "npm-publish/dist/dockitai-cli-win32-arm64.exe" .

          cd npm-publish

          sed -i "s/\$VERSION/${VERSION//\//\\/}/g" package.json

          touch dockitai-cli dockitai-cli.exe

          npm publish --access public