name: Release GitDocAI CLI (Dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0-dev.1)'
        required: true
        type: string

jobs:
  build-and-release-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          sed -i 's/const VERSION = ""/const VERSION = "'$VERSION'"/' config/const.go

          mkdir -p npm-publish/dist

          echo "Building gitdocai-cli for multiple platforms..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "npm-publish/dist/gitdocai-cli-darwin-x64" .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "npm-publish/dist/gitdocai-cli-darwin-arm64" .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "npm-publish/dist/gitdocai-cli-linux-arm64" .
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "npm-publish/dist/gitdocai-cli-linux-x64" .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o "npm-publish/dist/gitdocai-cli-win32-x64.exe" .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o "npm-publish/dist/gitdocai-cli-win32-arm64.exe" .

          cd npm-publish

          sed -i "s/\$VERSION/${VERSION//\//\\/}/g" package.json

          touch gitdocai-cli gitdocai-cli.exe

          npm publish --tag dev --access public
