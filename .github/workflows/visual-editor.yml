name: Build Visual Editor Docker Image

on:
  workflow_run:
    workflows: ["Release GitDocAI CLI"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/visual-editor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code into the right branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: gitdocai
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push the Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gitdocai/gitdocai/visual-editor:${{ steps.tag.outputs.TAG_NAME }}
          build-args: |
            CLI_VERSION=${{ steps.tag.outputs.TAG_NAME }}

