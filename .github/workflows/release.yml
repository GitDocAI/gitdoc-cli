name: Release

# The only pipeline. It runs when a GitHub Release is published: it typechecks
# and tests, then publishes @gitdocai/cli to npm. The version is the release tag
# (v0.1.0 → 0.1.0). If anything fails, nothing is published.
#
# Jobs run on GitHub-hosted runners (`ubuntu-latest`) for now. To use the
# organisation's own runner again, set `runs-on: gitdocai-dev` in every job.
on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Version from the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          npm pkg set version="$VERSION"

      # The package is built from the tagged commit with that version.
      - run: npm run build

      # Same mechanism as before: an .npmrc that reads the token from NPM_TOKEN.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc

          # A pre-release must not become `latest`.
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next --access public
          else
            npm publish --access public
          fi
