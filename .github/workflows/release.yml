name: Release

# Publishes to npm when a version tag is pushed:  git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" ] \
            || { echo "tag ${GITHUB_REF_NAME} does not match package.json"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
