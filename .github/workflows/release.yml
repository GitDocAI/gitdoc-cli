name: Release

# Publishes gitdoc-cli to npm when a GitHub Release is published. The version
# is the release tag (v0.1.0 → 0.1.0).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Version from the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          npm pkg set version="$VERSION"

      - run: npm run typecheck
      - run: npm test

      # Same mechanism as before: an .npmrc that reads the token from NPM_TOKEN.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc

          # A pre-release must not become `latest`.
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next --access public
          else
            npm publish --access public
          fi
