project_name: dockitai-cli

release:
  github:
    owner:  ${{ .Env.GITHUB_REPOSITORY_OWNER }}
    name:   ${{ .Env.GITHUB_REPOSITORY }}

builds:
  - id: default
    main: .
    goos:   [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

publishers:
  - name: npm
    ids: [default]
    cmd: |
      PACKAGE_DIR="npm-package-{{ .Os }}-{{ .Arch }}"
      rm -rf "$PACKAGE_DIR"
      mkdir -p "$PACKAGE_DIR/bin"
      
      if [ "{{ .Os }}" = "windows" ]; then
        unzip -j "{{ .ArtifactPath }}" -d "$PACKAGE_DIR/bin/"
        BINARY_NAME="dockitai-cli.exe"
      else
        tar -xzf "{{ .ArtifactPath }}" -C "$PACKAGE_DIR/bin/" --strip-components=0
        BINARY_NAME="dockitai-cli"
      fi
      
      chmod +x "$PACKAGE_DIR/bin/"*
      
      echo "{
        \"name\": \"dockitai-cli-{{ .Os }}-{{ .Arch }}\",
        \"version\": \"{{ .Version }}\",
        \"description\": \"DockitAI CLI tool for {{ .Os }} {{ .Arch }}\",
        \"bin\": {
          \"dockitai-cli\": \"./bin/$BINARY_NAME\"
        },
        \"files\": [\"bin/\"],
        \"os\": [\"{{ .Os }}\"],
        \"cpu\": [\"{{ .Arch }}\"],
        \"repository\": {
          \"type\": \"git\",
          \"url\": \"https://github.com/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .Env.GITHUB_REPOSITORY }}.git\"
        },
        \"license\": \"Apache-2.0\"
      }" > "$PACKAGE_DIR/package.json"
      
      cd "$PACKAGE_DIR"
      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      npm publish --access public
    env:
      - NPM_TOKEN={{ .Env.NPM_TOKEN }}